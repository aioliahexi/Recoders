# Jetson Xavier NX 部署配置（按实际 USB 摄像头修改）
# 用 `camera_server --list` 查看识别的 /dev/videoN
data_dir=/data/camera
quota_mb=200000
segment_time_s=60
encoder=auto            # Jetson 上 auto 会优先 h264_nvv4l2（NVIDIA 硬编），无则 libx264
http_port=8000
rtsp_port=8554
api_key="change-me"     # 生产务必设置；留空关闭鉴权
host_ip=""              # 留空自动探测
autostart=true

[camera]
name=CAM01
device=/dev/video0
mock=false
width=1280
height=720
fps=30
input_format=mjpeg      # 相机直出 H.264 则填 h264
bitrate_kbps=2000
gop=60

[camera]
name=CAM02
device=/dev/video1
mock=false
width=1280
height=720
fps=30
input_format=mjpeg
bitrate_kbps=2000
gop=60
