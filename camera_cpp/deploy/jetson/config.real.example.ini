# 真实 USB 摄像头配置（2 路示例，已实测）
# 1) 插上摄像头后: camera_server --list 查看可采集的 /dev/videoN（每台相机常有两个节点，只有 index=0 的能采集）
# 2) 建议用 udev 固定: sudo ./deploy/jetson/make_udev_rules.sh -> /dev/cam01...
data_dir=/data/camera
quota_mb=200000
segment_time_s=60
encoder=auto            # Jetson 上 auto 自动启用 GStreamer nvv4l2 硬件编码
http_port=8000
rtsp_port=8554
api_key="camera2026"
host_ip=""
autostart=true

[camera]
name=CAM01
device=/dev/video0
mock=false
capture=gst
width=1920
height=1080
fps=30
input_format=mjpeg
bitrate_kbps=3000
gop=60
enabled=true

[camera]
name=CAM02
device=/dev/video2
mock=false
capture=gst
width=1920
height=1080
fps=30
input_format=mjpeg
bitrate_kbps=3000
gop=60
enabled=true

# 按需增加 3..N 路（先 --list 确认可采集节点）
